name: KURDISTAN DRIVE Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download game HTML from latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets www
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'KURDISTAN_DRIVE_FIXED.html' --dir release-assets
          if [ ! -s release-assets/KURDISTAN_DRIVE_FIXED.html ]; then
            echo 'ERROR: KURDISTAN_DRIVE_FIXED.html was not found in the latest GitHub Release.'
            echo 'Upload the game HTML to Releases with this exact filename: KURDISTAN_DRIVE_FIXED.html'
            exit 1
          fi
          cp release-assets/KURDISTAN_DRIVE_FIXED.html www/index.html
          test -s www/index.html
          echo 'Game HTML downloaded and prepared:'
          ls -lh www/index.html
          du -sh www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Configure and sync Android
        shell: bash
        run: |
          set -euo pipefail
          cat > capacitor.config.json <<'EOF_CONFIG'
          {
            "appId": "com.kurdistandrive.game",
            "appName": "KURDISTAN DRIVE",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF_CONFIG
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-DRIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

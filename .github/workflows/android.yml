name: KURDISTAN DRIVE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          elif [ -f KURDISTAN_DRIVE_FIXED.html ]; then
            cp KURDISTAN_DRIVE_FIXED.html www/index.html
          else
            echo 'ERROR: Put the game HTML in the repository root as index.html.'
            exit 1
          fi

          # Copy game assets/folders if they exist (models, sounds, textures, etc.).
          for item in assets models sounds textures; do
            if [ -e "$item" ]; then
              cp -R "$item" www/
            fi
          done

          test -s www/index.html
          echo 'Web files prepared:'
          du -sh www

      - name: Install Capacitor
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kurdistandrive.game",
            "appName": "KURDISTAN DRIVE",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-DRIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

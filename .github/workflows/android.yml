name: KURDISTAN DRIVE Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published
      - edited

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game files from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download v1.0 --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Extract game files and collect 3D models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/unpacked www

          # Extract ZIP files from the Release.
          while IFS= read -r -d '' archive; do
            folder="release-assets/unpacked/$(basename "$archive" .zip)"
            mkdir -p "$folder"
            unzip -oq "$archive" -d "$folder"
          done < <(find release-assets -maxdepth 1 -type f -iname '*.zip' -print0)

          # Select the HTML file from the uploaded game ZIP first.
          index_file="release-assets/unpacked/KURDISTAN_DRIVE_UPDATED/index.html"
          if [ ! -s "$index_file" ]; then
            index_file="$(find release-assets/unpacked -type f -iname 'index.html' -print -quit || true)"
          fi
          if [ -z "$index_file" ] || [ ! -s "$index_file" ]; then
            index_file="$(find release-assets -maxdepth 1 -type f -iname 'index.html' -print -quit || true)"
          fi
          if [ -z "$index_file" ] || [ ! -s "$index_file" ]; then
            echo "ERROR: index.html was not found in Release v1.0 assets."
            find release-assets -type f -printf '%p (%s bytes)\n' || true
            exit 1
          fi

          echo "Using game HTML: $index_file"
          cp -f "$index_file" www/index.html

          # Copy any companion files beside the selected HTML.
          html_dir="$(dirname "$index_file")"
          while IFS= read -r -d '' file; do
            cp -f "$file" www/
          done < <(find "$html_dir" -mindepth 1 -maxdepth 1 -type f ! -iname '*.html' ! -iname '*.htm' -print0)

          # Copy all GLB models from Release assets.
          while IFS= read -r -d '' model; do
            cp -f "$model" "www/$(basename "$model")"
          done < <(find release-assets -type f -iname '*.glb' -print0)

          # Create the filename expected by the game for the Raptor model.
          expected_raptor="www/ford_f150_raptor (2).glb"
          if [ ! -s "$expected_raptor" ]; then
            source_raptor="$(find www -maxdepth 1 -type f -iname 'ford_f150_raptor*.glb' -print -quit || true)"
            if [ -n "$source_raptor" ] && [ -s "$source_raptor" ]; then
              cp -f "$source_raptor" "$expected_raptor"
            fi
          fi

          if [ ! -s "$expected_raptor" ]; then
            echo "ERROR: Ford Raptor GLB is missing from Release v1.0."
            find www -maxdepth 1 -type f -iname '*.glb' -printf '%f\n' || true
            exit 1
          fi

          test -s www/index.html
          echo "Game HTML and models are ready:"
          ls -lh www/index.html
          find www -maxdepth 1 -type f -iname '*.glb' -printf '%f (%s bytes)\n' | sort

      - name: Create Android project
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.kurdistandrive.game",
            "appName": "KURDISTAN DRIVE",
            "webDir": "www"
          }
          JSON

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-DRIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: KURDISTAN DRIVE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published
      - edited

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game files from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p release-assets
          gh release download v1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - name: Extract game files and collect 3D models
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets/unpacked www

          echo "Downloaded Release assets:"
          find release-assets -maxdepth 2 -type f -printf '%p (%s bytes)\n' || true

          # Extract every ZIP asset, including archives with nested folders.
          while IFS= read -r -d '' ARCHIVE; do
            DEST="release-assets/unpacked/$(basename "$ARCHIVE" .zip)"
            mkdir -p "$DEST"
            unzip -oq "$ARCHIVE" -d "$DEST"
          done < <(find release-assets -type f -iname "*.zip" -print0)

          # Prefer index.html; otherwise accept another HTML asset name.
          # Prefer the new index.html inside the uploaded game ZIP over any old loose HTML asset.
          INDEX=$(find release-assets/unpacked -type f -iname "index.html" -print -quit || true)
          if [ -z "$INDEX" ]; then
            INDEX=$(find release-assets -maxdepth 1 -type f -iname "index.html" -print -quit || true)
          fi
          if [ -z "$INDEX" ]; then
            INDEX=$(find release-assets/unpacked -type f \( -iname "*.html" -o -iname "*.htm" \) -print -quit || true)
          fi
          if [ -z "$INDEX" ]; then
            INDEX=$(find release-assets -maxdepth 1 -type f \( -iname "*.html" -o -iname "*.htm" \) -print -quit || true)
          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: No HTML game file was found in Release v1.0 assets."
            echo "All downloaded files:"
            find release-assets -type f -printf '%p (%s bytes)\n' || true
            exit 1
          fi

          echo "Using game HTML: $INDEX"
          cp "$INDEX" www/index.html

          # Copy loose companion files beside the selected HTML.
          HTML_DIR="$(dirname "$INDEX")"
          find "$HTML_DIR" -mindepth 1 -maxdepth 1 -type f ! -iname "*.html" ! -iname "*.htm" \
            -exec cp -f {} www/ \\;

          # Copy all separately attached 3D models beside index.html.
          find release-assets -type f -iname "*.glb" -print0 | \
            while IFS= read -r -d '' MODEL; do
              cp -f "$MODEL" "www/$(basename "$MODEL")"
            done

          # Support the known Raptor filename variants.
          RAPTOR="www/ford_f150_raptor (2).glb"
          if [ ! -s "$RAPTOR" ]; then
            FOUND_RAPTOR=$(find www -maxdepth 1 -type f -iname 'ford_f150_raptor*.glb' -print -quit || true)
            if [ -n "$FOUND_RAPTOR" ] && [ -s "$FOUND_RAPTOR" ]; then
              cp -f "$FOUND_RAPTOR" "$RAPTOR"
              echo "Raptor model normalized from: $(basename "$FOUND_RAPTOR")"
            fi
          fi

          if [ ! -s "$RAPTOR" ]; then
            echo "ERROR: Ford Raptor GLB is missing from the v1.0 Release assets."
            echo "Available GLB files:"
            find www -maxdepth 1 -type f -iname "*.glb" -printf '%f\n' || true
            exit 1
          fi

          echo "Game files prepared:"
          ls -lh www/index.html "$RAPTOR"

      - name: Create Android project
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.kurdistandrive.game",
            "appName": "KURDISTAN DRIVE",
            "webDir": "www"
          }
          JSON

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-DRIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: KURDISTAN DRIVE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game files from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download v1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - name: Extract game files and collect 3D models
        run: |
          set -e

          find release-assets -type f -name "*.zip" \
            -exec unzip -oq {} -d release-assets/unpacked \;

          INDEX=$(find release-assets -type f \
            -name "index.html" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was not found in Release assets!"
            exit 1
          fi

          mkdir -p www
          cp -R "$(dirname "$INDEX")"/. www/

          # Copy separately attached GLB files into the same folder as index.html.
          find release-assets -type f -iname "*.glb" -print0 | \
            while IFS= read -r -d '' MODEL; do
              cp -f "$MODEL" "www/$(basename "$MODEL")"
            done

          # Release may store the same Raptor model with a slightly different filename.
          RAPTOR="www/ford_f150_raptor (2).glb"
          if [ ! -s "$RAPTOR" ]; then
            FOUND_RAPTOR=$(find www -maxdepth 1 -type f -iname 'ford_f150_raptor*.glb' -print -quit)
            if [ -n "$FOUND_RAPTOR" ] && [ -s "$FOUND_RAPTOR" ]; then
              cp -f "$FOUND_RAPTOR" "$RAPTOR"
              echo "Raptor model normalized from: $(basename "$FOUND_RAPTOR")"
            fi
          fi

          if [ ! -s "$RAPTOR" ]; then
            echo "ERROR: Ford Raptor GLB is missing from the v1.0 Release assets."
            echo "Available GLB files:"
            find www -maxdepth 1 -type f -iname "*.glb" -printf '%f\n' || true
            exit 1
          fi

          echo "Game files prepared:"
          ls -lh www/index.html "$RAPTOR"

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kurdistandrive.game",
            "appName": "KURDISTAN DRIVE",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-DRIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

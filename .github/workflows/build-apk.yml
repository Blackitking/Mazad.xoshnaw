
name: KURDISTAN DRIVE APK - Release Builder

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download game files from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets www

          echo "Downloading latest Release assets..."

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "*"

          echo "Release assets:"
          ls -lh release-assets/

          if [ -s "release-assets/index.html" ]; then
            GAME_HTML="release-assets/index.html"
          elif [ -s "release-assets/KURDISTAN_DRIVE_FIXED.html" ]; then
            GAME_HTML="release-assets/KURDISTAN_DRIVE_FIXED.html"
          else
            echo "::error::Game HTML not found in Release."
            exit 1
          fi

          cp "$GAME_HTML" www/index.html

          find release-assets -maxdepth 1 -type f \
            \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.bin' \) \
            -exec cp -f {} www/ \;

          test -s www/index.html

          echo "Prepared game files:"
          ls -lh www/
          du -sh www/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Configure and sync Android
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<'EOF_CONFIG'
          {
            "appId": "com.kurdistandrive.game",
            "appName": "KURDISTAN DRIVE",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF_CONFIG

          npx cap add android
          npx cap sync android

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KURDISTAN-DRIVE.apk
          ls -lh KURDISTAN-DRIVE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-DRIVE-APK
          path: KURDISTAN-DRIVE.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')

          gh release upload "$RELEASE_TAG" KURDISTAN-DRIVE.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "APK uploaded successfully."
